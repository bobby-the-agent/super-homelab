apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-workers
  namespace: apps
  labels:
    app: immich
    role: workers
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: immich
      role: workers
  template:
    metadata:
      labels:
        app: immich
        role: workers
    spec:
      containers:
        - name: immich-worker
          image: ghcr.io/immich-app/immich-server:v3.3.6
          env:
            - name: IMMICH_WORKERS_EXCLUDE
              value: "api"
            - name: REDIS_HOSTNAME
              value: immich-valkey
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: immich-db-url
                  key: DB_URL
            - name: DB_HOSTNAME
              value: "{{ .Release.Name }}-postgresql"
            - name: DB_USERNAME
              value: "{{ .Values.postgresql.global.postgresql.auth.username }}"
            - name: DB_DATABASE_NAME
              value: "{{ .Values.postgresql.global.postgresql.auth.database }}"
            - name: DB_PASSWORD
              value: "{{ .Values.postgresql.global.postgresql.auth.password }}"
            - name: IMMICH_IGNORE_MOUNT_CHECK_ERRORS
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: library
              mountPath: /usr/src/app/upload
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-pvc-nfs
